html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.s{margin-top:-30px;padding:0 16px}

#s:focus{outline:3px solid var(--o)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px}
.chips button{flex:none;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips .on{background:var(--o);border-color:var(--o);color:#fff;font-weight:600}
main{padding:6px 16px 40px}
#cnt{color:var(--m);font-size:14px;margin:10px 2px 0}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;margin:10px 0;overflow:hidden;transition:box-shadow .2s}
.card:hover,.card.open{box-shadow:0 4px 16px rgba(11,60,140,.12)}
.card.open{border-color:var(--o)}
.q{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;cursor:pointer}
.q:focus-visible{outline:3px solid var(--o);outline-offset:-3px}
.qt{flex:1;font-weight:600}
.tag{flex:none;font-size:12px;font-weight:700;color:var(--tc);background:rgba(245,130,32,.15);border-radius:8px;padding:3px 8px;max-width:38%;text-align:center}
.q i{flex:none;width:9px;height:9px;border:solid var(--b2);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);transition:transform .2s}
.card.open .q i{transform:rotate(-135deg);border-color:var(--o)}
.a{padding:2px 16px 16px;border-top:1px dashed var(--l)}
.a h4{margin:14px 0 4px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--o)}
.p{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--l);border-radius:12px;margin:8px 0}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:700}
.pi{flex:1;min-width:160px;display:flex;flex-direction:column}
.pi small{color:var(--m)}
.ph{display:flex;gap:8px;align-items:center}
.ph a{color:var(--lk);font-weight:600;text-decoration:none}
.ph .wa,.lk{background:var(--o);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;text-decoration:none;font-weight:600}
.lk{display:inline-block;margin:6px 6px 0 0;padding:9px 14px}
.n{margin:8px 0;padding:10px 12px;border-left:4px solid var(--o);background:rgba(245,130,32,.1);border-radius:0 10px 10px 0}
.empty{text-align:center;color:var(--m);padding:30px 0}
footer{text-align:center;color:var(--m);font-size:13px;padding:0 16px 24px}
</style>
</head>

const fmt=n=>n.length==10?n.replace(/(\d{3})(\d{3})(\d{4})/,"$1 $2 $3"):n;
const person=([r,n,t])=>`<div class="p"><b class="av">${(n||r)[0]}</b><div class="pi"><small>${r}</small><strong>${n||"Nombre por confirmar"}</strong></div><span class="ph"><a href="tel:${t}">${fmt(t)}</a>${t.length==10?`<a class="wa" href="https://wa.me/57${t}" target="_blank" rel="noopener">WhatsApp</a>`:""}</span></div>`;
const ref=r=>P[r]?person(P[r]):G[r]?`<h4>${G[r][0]}</h4>`+G[r][1].map(i=>person(P[i])).join(""):L[r]?`<a class="lk" href="${L[r][1]}" target="_blank" rel="noopener">${L[r][0]} ↗</a>`:r=="can"?can:`<p class="n">${r}</p>`;
const SW=new Set("como que debo puedo para por con una uno los las del mis mas hay quien donde cual cuando cuanto esta este hacer tengo necesito quiero".split(" "));
const SY={permiso:"licencia",descanso:"vacaciones",sueldo:"salario",salarial:"salario",pago:"nomina",pagos:"nomina",quincena:"nomina",despido:"renuncia",retiro:"renuncia",epp:"dotacion",uniforme:"dotacion",casco:"dotacion",sancion:"disciplinario",llamado:"disciplinario",contratar:"seleccion",reclutamiento:"seleccion",candidato:"seleccion",enfermedad:"incapacidad",enfermo:"incapacidad",medica:"incapacidad",accidentes:"accidente"};
const stem=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!SW.has(w)).map(w=>(SY[w]||w).slice(0,5));
function similar(pool,t){const a=new Set(stem(t));return pool.map(x=>{const b=new Set(stem(x[1]+" "+C[x[0]][0]));let s=0;a.forEach(w=>b.has(w)&&s++);return[s/a.size,x]}).filter(r=>r[0]>0).sort((m,n)=>n[0]-m[0]).slice(0,3).map(r=>r[1])}
let cat=-1,q="";
function chips(){$("#chips").innerHTML=[["Todas","✨"],...C].map((c,i)=>`<button class="${i-1==cat?"on":""}" data-c="${i-1}">${c[1]} ${c[0]}</button>`).join("")}
function draw(){
const k=norm(q),pool=Q.filter(x=>cat<0||x[0]==cat);let it=pool.filter(x=>norm(x[1]).includes(k)),sim=0;
if(!it.length&&k.trim()){it=similar(pool,q);sim=1}
$("#cnt").textContent=sim?"No encontramos esa pregunta exacta. Estas son las más parecidas:":it.length+(it.length==1?" pregunta":" preguntas");
$("#list").innerHTML=it.length?it.map(x=>`<article class="card"><button class="q" aria-expanded="false"><span class="qt">${x[1]}</span><span class="tag">${C[x[0]][1]} ${C[x[0]][0]}</span><i></i></button><div class="a" hidden><h4>Dirígete a</h4>${x[2].map(ref).join("")}</div></article>`).join(""):'<p class="empty">No encontramos preguntas parecidas. Prueba con otras palabras o escribe al Líder Administrativo.</p>';
}
$("#chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=+b.dataset.c;chips();draw()};
$("#s").oninput=e=>{q=e.target.value;draw()};
$("#list").onclick=e=>{const b=e.target.closest(".q");if(!b)return;const c=b.parentNode,o=c.classList.toggle("open");b.setAttribute("aria-expanded",o);c.querySelector(".a").hidden=!o};
chips();draw();
</script>
</body>
</html>
